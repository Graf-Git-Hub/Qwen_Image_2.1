name: installer-smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [void][scriptblock]::Create((Get-Content .\install.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content .\update_and_start.ps1 -Raw))
      - name: Validate application payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $chunkNames = @(
            '.\payload\qwen_app.py.gz.b64.001',
            '.\payload\qwen_app.py.gz.b64.002',
            '.\payload\qwen_app.py.gz.b64.003',
            '.\payload\qwen_app.py.gz.b64.004'
          )
          $b64 = ''
          foreach ($chunk in $chunkNames) { $b64 += (Get-Content $chunk -Raw).Trim() }
          [IO.File]::WriteAllBytes('.\qwen_app.py.gz', [Convert]::FromBase64String($b64))
          $in = [IO.File]::OpenRead('.\qwen_app.py.gz')
          try {
            $gz = New-Object IO.Compression.GzipStream($in,[IO.Compression.CompressionMode]::Decompress)
            try {
              $out = [IO.File]::Create('.\qwen_app.py')
              try { $gz.CopyTo($out) } finally { $out.Dispose() }
            } finally { $gz.Dispose() }
          } finally { $in.Dispose() }
          python -m py_compile .\qwen_app.py
          if (-not (Select-String -Path .\qwen_app.py -Pattern 'QwenImage21Pipeline' -Quiet)) { throw 'QwenImage21Pipeline missing' }
      - name: Validate required repository files
        shell: powershell
        run: |
          $required = @(
            'INSTALL_QWEN_IMAGE_2_1.cmd',
            'install.ps1',
            'START_QWEN_IMAGE_2_1.cmd',
            'update_and_start.ps1',
            'VERSION.txt',
            'payload\qwen_app.py.gz.b64.001',
            'payload\qwen_app.py.gz.b64.002',
            'payload\qwen_app.py.gz.b64.003',
            'payload\qwen_app.py.gz.b64.004',
            'loading_matrix.mp4',
            'queue_wait.webp'
          )
          foreach ($f in $required) { if (-not (Test-Path $f)) { throw "Missing: $f" } }

      - name: Validate public GitHub download paths
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            'User-Agent' = 'Qwen-Image-2.1-CI'
            'Accept' = 'application/vnd.github+json'
          }
          $requiredRemote = @(
            'install.ps1',
            'START_QWEN_IMAGE_2_1.cmd',
            'update_and_start.ps1',
            'VERSION.txt',
            'payload/qwen_app.py.gz.b64.001',
            'payload/qwen_app.py.gz.b64.002',
            'payload/qwen_app.py.gz.b64.003',
            'payload/qwen_app.py.gz.b64.004',
            'loading_matrix.mp4',
            'queue_wait.webp'
          )
          foreach ($path in $requiredRemote) {
            $escaped = ($path -split '/' | ForEach-Object { [Uri]::EscapeDataString($_) }) -join '/'
            $url = "https://api.github.com/repos/Graf-Git-Hub/Qwen_Image_2.1/contents/$escaped?ref=main"
            $obj = Invoke-RestMethod -Uri $url -Headers $headers -TimeoutSec 60
            if (-not $obj.content -or $obj.encoding -ne 'base64') { throw "Public download path invalid: $path" }
          }

