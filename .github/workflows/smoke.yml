name: installer-smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [void][scriptblock]::Create((Get-Content .\install.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content .\update_and_start.ps1 -Raw))

      - name: Validate exact embedded installer payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'qwen-installer-smoke'
          & .\install.ps1 -Target $target -NoStart -Silent -ValidatePayloadOnly

          $required = @(
            'qwen_app.py',
            'START_QWEN_IMAGE_2_1.cmd',
            'update_and_start.ps1',
            'loading_matrix.mp4',
            'queue_wait.webp'
          )
          foreach ($f in $required) {
            $p = Join-Path $target $f
            if (-not (Test-Path $p)) { throw "Installer did not create: $f" }
            if ((Get-Item $p).Length -lt 100) { throw "Installer created suspiciously small file: $f" }
          }

          python -m py_compile (Join-Path $target 'qwen_app.py')
          if (-not (Select-String -Path (Join-Path $target 'qwen_app.py') -Pattern 'QwenImage21Pipeline' -Quiet)) {
            throw 'QwenImage21Pipeline missing from installed app payload'
          }
          if (-not (Select-String -Path (Join-Path $target 'qwen_app.py') -Pattern 'FastAPI' -Quiet)) {
            throw 'FastAPI missing from installed app payload'
          }

      - name: Validate UTF-8 and autoload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'qwen-installer-smoke'
          $app = Join-Path $target 'qwen_app.py'
          $py = @(
            'from pathlib import Path',
            'import sys',
            'p = Path(sys.argv[1])',
            't = p.read_text(encoding="utf-8")',
            'assert ''APP_VERSION = "8.3.4"'' in t, "Installed app version is not 8.3.4"',
            'assert "_autoload_model_on_startup" in t, "Model autoload hook missing"',
            'assert "V8.3.4" in t, "Visible UI badge version missing"',
            'assert "\u00c3" not in t and "\u00c2" not in t, "Mojibake detected in installed app"',
            'for word in ("Aufl\u00f6sung", "St\u00fcckzahl", "Ma\u00dfe", "zur\u00fccksetzen"):',
            '    assert word in t, "UTF-8 text missing: " + word',
            'print("UTF8_AUTOLOAD_OK")'
          ) -join [Environment]::NewLine
          $pyFile = Join-Path $env:RUNNER_TEMP 'validate_qwen_utf8.py'
          [IO.File]::WriteAllText($pyFile, $py, [Text.Encoding]::ASCII)
          python $pyFile $app
          if ($LASTEXITCODE -ne 0) { throw 'UTF-8/autoload validation failed' }

      - name: Validate queue media wiring
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'qwen-installer-smoke'
          $app = Join-Path $target 'qwen_app.py'
          $patterns = @(
            'function makeQueueVideo',
            'function makeQueueStill',
            'queueVideoUrl',
            '@app.get("/loading-video")',
            '@app.get("/queue-still")'
          )
          foreach ($pattern in $patterns) {
            if (-not (Select-String -Path $app -SimpleMatch -Pattern $pattern -Quiet)) {
              throw "Missing queue-media wiring: $pattern"
            }
          }

          $video = Join-Path $target 'loading_matrix.mp4'
          $still = Join-Path $target 'queue_wait.webp'
          if ((Get-Item $video).Length -lt 5000) { throw 'loading_matrix.mp4 suspiciously small' }
          if ((Get-Item $still).Length -lt 5000) { throw 'queue_wait.webp suspiciously small' }

      - name: Validate launcher root handling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP 'Qwen Root Test'
          $withSlash = $testRoot + '\\'
          & .\update_and_start.ps1 -Root $withSlash -ValidateRootOnly
          if ($LASTEXITCODE -ne 0) { throw 'Root normalization failed' }

          $starter = Get-Content .\START_QWEN_IMAGE_2_1.cmd -Raw
          if ($starter -notmatch '%~dp0\.') { throw 'Starter does not normalize %~dp0' }
          if ($starter -match 'set "ROOT=%~dp0"') { throw 'Old broken ROOT assignment still present' }

      - name: Validate repository entry files
        shell: powershell
        run: |
          $required = @(
            'INSTALL_QWEN_IMAGE_2_1.cmd',
            'install.ps1',
            'START_QWEN_IMAGE_2_1.cmd',
            'update_and_start.ps1',
            'VERSION.txt'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing: $f" }
          }
