name: installer-smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [void][scriptblock]::Create((Get-Content .\install.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content .\update_and_start.ps1 -Raw))

      - name: Validate exact embedded installer payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'qwen-installer-smoke'
          & .\install.ps1 -Target $target -NoStart -Silent -ValidatePayloadOnly

          $required = @(
            'qwen_app.py',
            'START_QWEN_IMAGE_2_1.cmd',
            'update_and_start.ps1',
            'loading_matrix.mp4',
            'queue_wait.webp'
          )
          foreach ($f in $required) {
            $p = Join-Path $target $f
            if (-not (Test-Path $p)) { throw "Installer did not create: $f" }
            if ((Get-Item $p).Length -lt 100) { throw "Installer created suspiciously small file: $f" }
          }

          python -m py_compile (Join-Path $target 'qwen_app.py')
          if (-not (Select-String -Path (Join-Path $target 'qwen_app.py') -Pattern 'QwenImage21Pipeline' -Quiet)) {
            throw 'QwenImage21Pipeline missing from installed app payload'
          }
          if (-not (Select-String -Path (Join-Path $target 'qwen_app.py') -Pattern 'FastAPI' -Quiet)) {
            throw 'FastAPI missing from installed app payload'
          }

      - name: Validate launcher root handling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP 'Qwen Root Test'
          $withSlash = $testRoot + '\\'
          & .\update_and_start.ps1 -Root $withSlash -ValidateRootOnly
          if ($LASTEXITCODE -ne 0) { throw 'Root normalization failed' }

          $starter = Get-Content .\START_QWEN_IMAGE_2_1.cmd -Raw
          if ($starter -notmatch '%~dp0\.') { throw 'Starter does not normalize %~dp0' }
          if ($starter -match 'set "ROOT=%~dp0"') { throw 'Old broken ROOT assignment still present' }

      - name: Validate repository entry files
        shell: powershell
        run: |
          $required = @(
            'INSTALL_QWEN_IMAGE_2_1.cmd',
            'install.ps1',
            'START_QWEN_IMAGE_2_1.cmd',
            'update_and_start.ps1',
            'VERSION.txt'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing: $f" }
          }
