name: Qwen Space aktualisieren

on:
  push:
    branches: [main]
    paths:
      - 'hf-space/**'
      - '.github/workflows/qwen-space.yml'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Dateien laden
        uses: actions/checkout@v4
      - name: Auf Token warten
        if: env.HF_TOKEN == ''
        run: echo 'HF_TOKEN fehlt. Trage ihn als Repository Secret ein und starte diesen Workflow erneut.'
      - name: Hugging Face CLI installieren
        if: env.HF_TOKEN != ''
        run: python -m pip install 'huggingface_hub[cli]>=0.34,<2'
      - name: Nur Space-Dateien übertragen
        if: env.HF_TOKEN != ''
        run: hf upload LucanDerLurch/RPG_Maker_MV_Tileset_Creator ./hf-space . --repo-type space --commit-message 'Qwen CPU Space aktualisieren'
      - name: Space-Start prüfen
        if: env.HF_TOKEN != ''
        run: |
          python - <<'PY'
          import time
          from huggingface_hub import HfApi

          api = HfApi()
          space = 'LucanDerLurch/RPG_Maker_MV_Tileset_Creator'
          for attempt in range(30):
              runtime = api.get_space_runtime(space)
              print(f'Prüfung {attempt + 1}/30: {runtime.stage}, Hardware: {runtime.hardware}', flush=True)
              if runtime.stage == 'RUNNING':
                  break
              if runtime.stage in {'BUILD_ERROR', 'RUNTIME_ERROR', 'CONFIG_ERROR'}:
                  raise SystemExit(f'Space konnte nicht starten: {runtime.stage}')
              time.sleep(10)
          else:
              raise SystemExit('Space nach fünf Minuten noch nicht gestartet; Build-Logs prüfen.')
          PY
